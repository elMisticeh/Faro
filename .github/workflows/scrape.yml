name: Scrape semanal

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      portal:
        description: 'Portal (todos|i24|remax|ml|prop)'
        required: false
        default: 'todos'
      skip_ia:
        description: 'Omitir IA (true/false)'
        required: false
        default: 'false'

jobs:
  scrape:
    name: Pipeline completo
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Playwright
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Correr pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHA_PORTAL: ${{ github.event.inputs.portal || 'todos' }}
          GHA_SKIP_IA: ${{ github.event.inputs.skip_ia || 'false' }}
        run: |
          case "$GHA_PORTAL" in
            todos|i24|viva|lamudi|icasas|mc|prop|trovit|ml|remax) ;;
            *) echo "ERROR: portal no permitido"; exit 1 ;;
          esac
          if [ "$GHA_SKIP_IA" = "true" ]; then
            python run.py full --skip-ia
          else
            python run.py full
          fi

      - name: Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log-${{ github.run_id }}
          path: '*.log'
          retention-days: 30
          if-no-files-found: ignore
